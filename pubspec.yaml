name: ever_up_to_date
description: "Headless Flutter app updates with JSON appcasts, verified downloads, and platform installers."
version: 0.0.1
homepage: https://github.com/linchi07/ever_up_to_date
repository: https://github.com/linchi07/ever_up_to_date

environment:
  sdk: ^3.11.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  http: ^1.6.0
  crypto: ^3.0.3
  cryptography: ^2.7.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.2
  url_launcher: ^6.3.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.everuptodate.ever_up_to_date
        pluginClass: EverUpToDatePlugin
      ios:
        pluginClass: EverUpToDatePlugin
      linux:
        pluginClass: EverUpToDatePlugin
      macos:
        pluginClass: EverUpToDatePlugin
      windows:
        pluginClass: EverUpToDatePluginCApi
